name: Run Gemma4Tunnel on Modal

on:
  workflow_dispatch:
    inputs:
      action:
        description: "ingest, train, or all"
        required: true
        default: "ingest"
        type: choice
        options:
          - ingest
          - train
          - all
      base_model:
        description: "Base model"
        required: true
        default: "unsloth/gemma-4-12b-it"
      dataset_repo:
        description: "HF dataset repo, e.g. username/gemma4tunnel-data"
        required: true
        default: "TUSTResearcher/gemma4tunnel-data"
      model_repo:
        description: "HF model repo, e.g. username/gemma4tunnel"
        required: true
        default: "TUSTResearcher/gemma4tunnel"
      max_steps:
        description: "Training steps; use 20 for smoke test"
        required: true
        default: "20"
      max_seq_length:
        description: "Sequence length"
        required: true
        default: "4096"
      gpu:
        description: "Modal GPU type"
        required: true
        default: "H100"
        type: choice
        options:
          - H100
          - H200
          - A100-80GB
          - L40S
          - B200

jobs:
  run-on-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
      ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
      ZOTERO_LIBRARY_TYPE: ${{ secrets.ZOTERO_LIBRARY_TYPE }}
      ZOTERO_LIBRARY_ID: ${{ secrets.ZOTERO_LIBRARY_ID }}
      ZOTERO_COLLECTION_KEY: ${{ secrets.ZOTERO_COLLECTION_KEY }}
      UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
      MODAL_GPU: ${{ inputs.gpu }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal client
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Run Modal pipeline
        run: |
          modal run modal_gemma4tunnel_zotero.py \
            --action "${{ inputs.action }}" \
            --base-model "${{ inputs.base_model }}" \
            --dataset-repo "${{ inputs.dataset_repo }}" \
            --model-repo "${{ inputs.model_repo }}" \
            --max-steps "${{ inputs.max_steps }}" \
            --max-seq-length "${{ inputs.max_seq_length }}" \
            --gpu "${{ inputs.gpu }}"
